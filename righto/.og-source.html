<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:'DM Sans',sans-serif}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;
    background:linear-gradient(160deg,#E0F4F9 0%,#FAFAF8 45%,#FFF8EE 100%);
    display:flex;flex-direction:column;justify-content:center;padding:0 90px 104px}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
  .b1{width:620px;height:620px;background:#0095B6;top:-180px;left:-160px}
  .b2{width:520px;height:520px;background:#F0A500;bottom:-200px;right:-120px}
  .b3{width:360px;height:360px;background:#6B3FA0;top:38%;right:14%}
  .inner{position:relative}
  .badge{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(0,149,182,.3);
    border-radius:40px;padding:9px 22px;font-size:19px;font-weight:500;color:#006B82;margin-bottom:30px;
    box-shadow:0 2px 14px rgba(0,149,182,.12)}
  .dot{width:10px;height:10px;background:#0095B6;border-radius:50%}
  .name{font-family:'DM Serif Display',serif;font-size:116px;line-height:1;color:#0095B6;letter-spacing:-.03em;margin-bottom:18px}
  .head{font-family:'DM Serif Display',serif;font-size:52px;line-height:1.14;color:#1A1A2E;letter-spacing:-.02em;max-width:900px;margin-bottom:22px}
  .sub{font-size:25px;font-weight:300;color:#4A4A6A;line-height:1.5;max-width:860px}
  .foot{position:absolute;left:90px;bottom:50px;font-family:'DM Serif Display',serif;font-size:30px;color:#0095B6}
  .strip{position:absolute;left:0;right:0;bottom:0;height:10px;
    background:linear-gradient(90deg,#C8003E 0%,#E8600A 20%,#F0A500 40%,#5BAD3C 60%,#0095B6 80%,#6B3FA0 100%)}
</style></head><body>
<div class="card">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="inner">
    <div class="badge"><span class="dot"></span>Coming soon</div>
    <div class="name">Righto</div>
    <div class="head">Safe AI use on every Mac, without the friction.</div>
    <div class="sub">See which AI tools your team uses, coach people in the moment,<br>and get compliance evidence automatically.</div>
  </div>
  <div class="foot">dhaataa</div>
  <div class="strip"></div>
</div></body></html>
